dataset:
  name: tcga
  real_csv: raw/tcga/TCGA_metadata_21_var_real.csv
  target: cancer_types            # classification target
  secondary_target: tcga.gdc_cases.diagnoses.vital_status  # mortality prediction target
  # Columns that leak the target and must not be used as features. dx_sub determines
  # dx_class outright -- all 73 of its values map to a single class -- and icu_death is
  # all but the same event as hospital_death. Carried over from the original evaluation
  # notebooks, where the drops were done inline.
  exclude_for:
    classification: []
    mortality: []
    clustering: ['cancer_types']
  train_frac: 0.6
  split_seed: 0
  stratify: true

maps:
  pool_multiplier: 30       # M = pool_multiplier * |D_train|
  alpha: 1.4                # applied to every generator on this dataset
  # 08_select_alpha.py selects alpha on a held-in validation split of D_train, with D_test
  # never loaded. Its per-generator values are not applied here: the reported experiments
  # were run with the single value above, and this file has to reproduce them. Populating
  # alpha_by_model would change the results the paper reports.
  alpha_by_model: {}
  replacement: true         # SIR draws with replacement (Appendix B.5)
  method: weighted
  weight_processing: flatten
  classifier:
    mlp_hidden_layer_sizes: [240, 120]
    classifier_test_size: 0.2
    calibration_method: sigmoid
    use_embedding: false

privacy:
  # DOMIAS settings, matching the published runs. GOSSIS is projected to 20 principal
  # components first: its 68 variables include collinear ones, so the covariance matrix is
  # singular and gaussian_kde cannot run on the raw encoding.
  domias_reference_size: 1000

evaluation:
  n_runs: 5
  clustering_k: 5
  test_size: 0.2
  cp_alpha: 0.05

models: [tvae, ctgan, ddpm, dgd]
